name: Verify Fork

on:
  push:
    branches:
      - custom/god-character-sheet
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    name: Test, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:run -- --reporter=dot

      - name: Run ESLint
        run: npm run eslint

      - name: Build styles
        run: npm run build:styles

      - name: Ensure generated styles are committed
        run: git diff --exit-code -- display/wod5e-styling.css

      - name: Verify release metadata
        run: npm run verify-release

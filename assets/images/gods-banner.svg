<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">World of Darkness 5e – Gods</title>
  <desc id="description">Cosmic violet eclipse, an illuminated divine crown and five stars. A Rhapsody-Sky fork.</desc>

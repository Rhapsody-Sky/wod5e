name: Verify Gods Fork

on:
  pull_request: {}
  push:
    branches: ['custom/god-character-sheet', 'codex/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Run Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --reporter=dot
      - run: npm run eslint
      - run: npm run build:styles
      - run: git diff --exit-code -- display/wod5e-styling.css
      - run: npm run verify-release
      - run: npm run normalize-upstream

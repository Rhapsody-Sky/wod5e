    <linearGradient id="silver" x2="0" y2="1"><stop stop-color="#fff5ff"/><stop offset="1" stop-color="#ba83ed"/></linearGradient>
    <pattern id="stars" width="170" height="140" patternUnits="userSpaceOnUse"><circle cx="18" cy="22" r="1.3" fill="#d0b5ec" opacity=".5"/><circle cx="111" cy="91" r=".8" fill="#d0b5ec" opacity=".35"/><circle cx="153" cy="41" r=".9" fill="#fceaff" opacity=".4"/></pattern>
  </defs>

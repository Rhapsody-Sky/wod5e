---
name: Build Fork Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Verify and attach Foundry package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: |
          npm run test:run -- --reporter=dot
          npm run eslint

      - name: Build and verify styles
        run: |
          npm run build:styles
          git diff --exit-code -- display/wod5e-styling.css

      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: npm run verify-release

      - name: Build and inspect package
        run: |
          npm run generate-release
          unzip -tq wod5e.zip
          sha256sum system.json wod5e.zip > SHA256SUMS.txt

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          system.json wod5e.zip SHA256SUMS.txt --clobber
